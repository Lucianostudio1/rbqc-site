[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.csv"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.textClipping"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/og-image-gen.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/og-image-source.html.png"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

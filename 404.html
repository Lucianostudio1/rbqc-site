<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable | RBQC</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-section {
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      padding: 120px 32px;
      background: var(--dark);
    }
    .error-code {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: clamp(7rem, 20vw, 18rem);
      text-transform: uppercase;
      line-height: 0.85;
      letter-spacing: -0.03em;
      color: rgba(255,255,255,0.06);
      display: block;
      margin-bottom: 0;
    }
    .error-title {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 4rem);
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: white;
      margin-bottom: 20px;
      margin-top: -40px;
    }
    .error-text {
      font-size: 1rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.7;
      max-width: 440px;
      margin-bottom: 44px;
    }
    .error-links {
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    }
  </style>
</head>
<body>

<section class="error-section">
  <span class="error-code">404</span>
  <h1 class="error-title">Ce punch-là<br>est tombé à plat.</h1>
  <p class="error-text">La page que tu cherches existe pas (ou plus). Retourne à l'accueil ou écris-nous si t'es perdu.</p>
  <div class="error-links">
    <a class="btn-primary" href="index.html">Retour à l'accueil</a>
    <a class="btn-ghost" href="contact.html" style="border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.5);">Nous écrire →</a>
  </div>
</section>

</body>
</html>
